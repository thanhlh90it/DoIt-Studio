<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="h-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="h-cyan-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Squircle Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#030712" stroke="#1E293B" stroke-width="2" />
    <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="url(#h-blue-grad)" stroke-width="1.5" opacity="0.6" />
    
    <!-- Monogram D -->
    <path d="M 28 28 C 28 24, 32 22, 36 22 L 52 22 C 68 22, 78 32, 78 50 C 78 68, 68 78, 52 78 L 36 78 C 32 78, 28 76, 28 72 Z M 40 34 L 40 66 L 50 66 C 58 66, 64 60, 64 50 C 64 40, 58 34, 50 34 Z" fill="url(#h-blue-grad)" />
    
    <!-- Cyber Cyan Dot -->
    <circle cx="78" cy="70" r="8" fill="url(#h-cyan-spark)" filter="url(#h-glow)" />
    <circle cx="78" cy="70" r="4" fill="#FFFFFF" />
  </g>

  <!-- Typography Logotype -->
  <g transform="translate(130, 48)">
    <!-- DoIT Wordmark -->
    <text x="0" y="24" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      DoIT
    </text>
    
    <!-- [STUDIO] Tag -->
    <text x="112" y="22" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#00F0FF" letter-spacing="0.05em">
      [STUDIO]
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="0.12em">
      CYBERNETIC PRODUCT &amp; TECH LAB
    </text>
  </g>
</svg>
