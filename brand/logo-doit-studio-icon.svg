<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ic-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ic-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="ic-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#030712" stroke="#1E293B" stroke-width="2" />
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="url(#ic-blue)" stroke-width="2" opacity="0.6" />
  
  <!-- Monogram D -->
  <path d="M 36 34 C 36 28, 40 26, 46 26 L 64 26 C 82 26, 96 38, 96 60 C 96 82, 82 94, 64 94 L 46 94 C 40 94, 36 92, 36 86 Z M 50 42 L 50 78 L 62 78 C 72 78, 80 70, 80 60 C 80 50, 72 42, 62 42 Z" fill="url(#ic-blue)" />
  
  <!-- Cyber Cyan Dot -->
  <circle cx="96" cy="86" r="10" fill="url(#ic-cyan)" filter="url(#ic-glow)" />
  <circle cx="96" cy="86" r="5" fill="#FFFFFF" />
</svg>
