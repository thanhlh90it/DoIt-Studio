<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Pledgo Chrono-P Flow Logo Mark (Nordic Zen Discipline) -->
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Trục đứng kiên định (The Monolith Stem) -->
  <rect x="20" y="16" width="10" height="68" rx="4" fill="url(#titaniumGrad)" />

  <!-- Vòng khuyên thời gian & Dòng cát 365 ngày (The Chrono Loop & Hourglass Wave) -->
  <path d="M 30 20 
           H 54 
           C 68 20, 78 28, 78 40 
           C 78 49, 70 56, 60 58 
           C 52 60, 44 58, 38 64 
           C 34 68, 32 74, 30 80
           L 30 68
           C 36 63, 42 61, 48 60
           C 62 58, 68 50, 68 40
           C 68 32, 60 28, 52 28
           H 30 Z" 
        fill="url(#bronzeGrad)" 
        filter="url(#subtleGlow)" />

  <!-- Sóng thoát động lực (The Go Wave Vector) -->
  <path d="M 44 65
           Q 58 64, 68 76
           L 78 76
           Q 64 60, 48 59 Z"
        fill="url(#titaniumGrad)"
        opacity="0.85" />

  <!-- Điểm hội tụ Ngày Hiện Tại (The Nexus Dot / Today Point) -->
  <circle cx="50" cy="39" r="3.5" fill="#FFFFFF" />
  <circle cx="50" cy="39" r="6" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.6" />
</svg>
