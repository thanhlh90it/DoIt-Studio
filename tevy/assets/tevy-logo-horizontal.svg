<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(15, 10)">
    <!-- Base Squircle -->
    <rect width="140" height="140" rx="36" fill="url(#logoBgGrad)" filter="url(#logoShadow)"/>

    <!-- Antennas -->
    <path d="M 58 46 L 44 32" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="42" cy="30" r="4.5" fill="url(#logoOrange)"/>
    <path d="M 82 46 L 96 32" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="98" cy="30" r="4.5" fill="url(#logoOrange)"/>

    <!-- TV Body -->
    <rect x="32" y="44" width="76" height="60" rx="14" fill="#FFFFFF"/>
    <!-- TV Legs -->
    <path d="M 48 104 L 44 114 M 92 104 L 96 114" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- TV Screen -->
    <rect x="38" y="50" width="64" height="48" rx="9" fill="#0F172A"/>

    <!-- Eyes -->
    <circle cx="54" cy="70" r="5" fill="#60A5FA"/>
    <circle cx="55" cy="69" r="2" fill="#FFFFFF"/>
    <circle cx="86" cy="70" r="5" fill="#60A5FA"/>
    <circle cx="87" cy="69" r="2" fill="#FFFFFF"/>

    <!-- Smile -->
    <path d="M 64 77 Q 70 84 76 77" fill="none" stroke="url(#logoOrange)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(185, 30)">
    <!-- Main Name "Tevy" -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
      Tev<tspan fill="#F97316">y</tspan>
    </text>

    <!-- Subtitle / Category Badge -->
    <text x="2" y="104" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563EB" letter-spacing="1.2">
      KIDS TV PARENTAL CONTROL
    </text>

    <!-- Subtle Dots Accent -->
    <circle cx="360" cy="56" r="5" fill="#10B981"/>
    <circle cx="376" cy="56" r="4" fill="#F59E0B"/>
  </g>
</svg>
