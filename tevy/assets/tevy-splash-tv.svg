<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Slate OLED-Friendly TV Background -->
    <linearGradient id="tvSplashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Center Radial Aura -->
    <radialGradient id="tvAuraGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>

    <!-- TV Mascot White Frame -->
    <linearGradient id="tvMascotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="tvOrangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <filter id="tvDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#tvSplashBg)"/>
  <rect width="1920" height="1080" fill="url(#tvAuraGlow)"/>

  <!-- Subtle Shield Geometry in Center -->
  <path d="M 960 160 Q 1280 200 1340 460 Q 1340 760 960 920 Q 580 760 580 460 Q 640 200 960 160 Z"
        fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="16 16"/>

  <!-- Mascot Illustration (Centered) -->
  <g transform="translate(960, 440)" filter="url(#tvDropShadow)">
    <!-- Antennas -->
    <path d="M -70 -160 L -130 -240" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <circle cx="-138" cy="-248" r="18" fill="url(#tvOrangeAccent)"/>

    <path d="M 70 -160 L 130 -240" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <circle cx="138" cy="-248" r="18" fill="url(#tvOrangeAccent)"/>

    <!-- TV Outer Case -->
    <rect x="-190" y="-160" width="380" height="290" rx="60" fill="url(#tvMascotGrad)"/>

    <!-- TV Legs -->
    <path d="M -105 130 L -130 180 M 105 130 L 130 180" stroke="#94A3B8" stroke-width="18" stroke-linecap="round"/>

    <!-- TV Screen -->
    <rect x="-155" y="-125" width="310" height="220" rx="38" fill="#0B1120"/>

    <!-- Mascot Glowing Eyes -->
    <circle cx="-75" cy="-25" r="24" fill="#60A5FA"/>
    <circle cx="-68" cy="-32" r="8" fill="#FFFFFF"/>

    <circle cx="75" cy="-25" r="24" fill="#60A5FA"/>
    <circle cx="82" cy="-32" r="8" fill="#FFFFFF"/>

    <!-- Mascot Smile -->
    <path d="M -35 15 Q 0 48 35 15" fill="none" stroke="url(#tvOrangeAccent)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- Name: Tevy -->
  <text x="960" y="720" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="108" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">
    Tev<tspan fill="#F97316">y</tspan>
  </text>

  <!-- Subtitle Pill Badge -->
  <g transform="translate(960, 770)">
    <rect x="-180" y="0" width="360" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="27" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="3">
      KIDS TV PARENTAL CONTROL
    </text>
  </g>

  <!-- Tagline Vietnamese & English -->
  <text x="960" y="860" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">
    Cân bằng giờ xem, bảo vệ đôi mắt trẻ • Balance Screen Time, Protect Growing Minds
  </text>

  <!-- Android TV Leanback Certified Logo Badge in Corner (Safe Zone) -->
  <g transform="translate(960, 990)">
    <circle cx="-80" cy="0" r="4" fill="#10B981"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle">
      Android TV System WatchDog Service v1.0
    </text>
  </g>
</svg>
