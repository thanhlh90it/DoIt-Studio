<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hudCornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="98%" stop-color="#00F2FE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Translucent Glass Reticle Bounds (280x280 centered) -->
  <rect x="20" y="20" width="280" height="280" rx="36" fill="#0B132B" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Scanning Laser Beam -->
  <rect x="30" y="110" width="260" height="36" fill="url(#laserGrad)"/>
  <line x1="30" y1="146" x2="290" y2="146" stroke="#00F2FE" stroke-width="2.5" filter="url(#hudGlow)"/>

  <!-- Top-Left Corner Bracket -->
  <path d="M 28 64 L 28 44 C 28 35, 35 28, 44 28 L 64 28" fill="none" stroke="url(#hudCornerGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#hudGlow)"/>

  <!-- Top-Right Corner Bracket -->
  <path d="M 256 28 L 276 28 C 285 28, 292 35, 292 44 L 292 64" fill="none" stroke="url(#hudCornerGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#hudGlow)"/>

  <!-- Bottom-Left Corner Bracket -->
  <path d="M 28 256 L 28 276 C 28 285, 35 292, 44 292 L 64 292" fill="none" stroke="url(#hudCornerGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#hudGlow)"/>

  <!-- Bottom-Right Corner Bracket -->
  <path d="M 256 292 L 276 292 C 285 292, 292 285, 292 276 L 292 256" fill="none" stroke="url(#hudCornerGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#hudGlow)"/>

  <!-- Center Target Crosshair Pips -->
  <circle cx="160" cy="160" r="4" fill="#00F2FE" filter="url(#hudGlow)"/>
  <circle cx="160" cy="160" r="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="160" y1="136" x2="160" y2="146" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="174" x2="160" y2="184" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
  <line x1="136" y1="160" x2="146" y2="160" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
  <line x1="174" y1="160" x2="184" y2="160" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
</svg>

