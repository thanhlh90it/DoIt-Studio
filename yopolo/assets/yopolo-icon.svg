<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#06080F"/>
    </linearGradient>

    <!-- Aurora Nebula Radial Gradients -->
    <radialGradient id="auroraCyan" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0080FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPurple" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#6B21A8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraPink" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#BE185D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Specular Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Y-Nexus Ribbon Gradients -->
    <!-- Left Wing: Cyan into Deep Azure -->
    <linearGradient id="leftWingGrad" x1="15%" y1="15%" x2="55%" y2="65%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#00F2FE"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Right Wing: Pink into Violet into Indigo -->
    <linearGradient id="rightWingGrad" x1="85%" y1="15%" x2="45%" y2="65%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="30%" stop-color="#D946EF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Nexus Stem: Blended Neural Core -->
    <linearGradient id="stemGrad" x1="50%" y1="45%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Speech Wave Accent Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowGlass" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00F2FE" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Shadow -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad)" filter="url(#shadowGlass)"/>

  <!-- Aurora Nebulas Inside App Icon (Clipped to Squircle) -->
  <g clip-path="url(#squircleClip)">
    <clipPath id="squircleClip">
      <rect x="28" y="28" width="456" height="456" rx="108"/>
    </clipPath>

    <!-- Deep Ambient Backdrops -->
    <rect x="28" y="28" width="456" height="456" fill="url(#auroraCyan)"/>
    <rect x="28" y="28" width="456" height="456" fill="url(#auroraPurple)"/>
    <rect x="28" y="28" width="456" height="456" fill="url(#auroraPink)"/>

    <!-- Subtle Tech Coordinate Grid -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="256" cy="256" r="100" fill="none" stroke="#00F2FE" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="256" cy="256" r="210" fill="none" stroke="#A855F7" stroke-opacity="0.03" stroke-width="1"/>
    <line x1="256" y1="40" x2="256" y2="472" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" stroke-dasharray="3 6"/>
    <line x1="40" y1="256" x2="472" y2="256" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" stroke-dasharray="3 6"/>

    <!-- Glass Frosted Reflection Curve -->
    <path d="M 28 136 C 140 180, 372 170, 484 100 L 484 28 L 28 28 Z" fill="url(#glassReflection)"/>

    <!-- THE AURORA Y-NEXUS EMBLEM -->
    <!-- Underglow for Y Symbol -->
    <g filter="url(#intenseGlow)" opacity="0.6">
      <!-- Left Upper Wing Glow -->
      <path d="M 148 138 C 178 188, 222 232, 256 264 C 220 230, 185 180, 160 138 Z" fill="#00F2FE"/>
      <!-- Right Upper Wing Glow -->
      <path d="M 364 138 C 334 188, 290 232, 256 264 C 292 230, 327 180, 352 138 Z" fill="#D946EF"/>
      <!-- Stem Glow -->
      <path d="M 256 264 L 256 384" stroke="#38BDF8" stroke-width="28" stroke-linecap="round"/>
    </g>

    <!-- Main Dynamic Ribbons (Soundwave + Mobius Loop Convergence) -->
    <!-- 1. Left Ribbon (Speech Resonance Branch) -->
    <path d="M 126 142 
             C 142 120, 176 124, 196 154 
             C 216 184, 238 226, 256 260 
             C 240 220, 214 176, 184 146 
             C 166 128, 142 124, 126 142 Z" 
          fill="url(#leftWingGrad)" filter="url(#glowFilter)"/>

    <!-- Left Bold Fluid Flow Ribbon -->
    <path d="M 132 148 
             C 170 196, 212 242, 256 272
             C 246 256, 236 232, 218 198
             C 202 166, 172 136, 144 134
             C 134 133, 126 140, 132 148 Z" 
          fill="url(#leftWingGrad)"/>

    <!-- 2. Right Ribbon (Global Explorer Loop Branch) -->
    <path d="M 386 142 
             C 370 120, 336 124, 316 154 
             C 296 184, 274 226, 256 260 
             C 272 220, 298 176, 328 146 
             C 346 128, 370 124, 386 142 Z" 
          fill="url(#rightWingGrad)" filter="url(#glowFilter)"/>

    <!-- Right Bold Fluid Flow Ribbon -->
    <path d="M 380 148 
             C 342 196, 300 242, 256 272
             C 266 256, 276 232, 294 198
             C 310 166, 340 136, 368 134
             C 378 133, 386 140, 380 148 Z" 
          fill="url(#rightWingGrad)"/>

    <!-- 3. Dynamic Center Stem (The Convergence Pillar) -->
    <path d="M 243 262 
             C 252 272, 260 272, 269 262 
             L 269 368 
             C 269 378, 256 388, 256 388 
             C 256 388, 243 378, 243 368 
             Z" 
          fill="url(#stemGrad)"/>

    <rect x="246" y="270" width="20" height="104" rx="10" fill="url(#stemGrad)" filter="url(#glowFilter)"/>

    <!-- 4. Modern Deep Tech Speech Pulses (Acoustic Echo Rings around arms) -->
    <!-- Left Sound Waves -->
    <path d="M 98 162 C 108 142, 122 128, 140 118" fill="none" stroke="#00F2FE" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" filter="url(#glowFilter)"/>
    <path d="M 80 178 C 94 148, 114 126, 142 108" fill="none" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4"/>
    
    <!-- Right Explorer Orbit Arc -->
    <path d="M 414 162 C 404 142, 390 128, 372 118" fill="none" stroke="#EC4899" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" filter="url(#glowFilter)"/>
    <path d="M 432 178 C 418 148, 398 126, 370 108" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- 5. Central AI Intelligence Star (Nexus Spark at Intersection) -->
    <g transform="translate(256, 262)">
      <!-- Giant Halo -->
      <circle cx="0" cy="0" r="44" fill="url(#sparkGlow)"/>
      
      <!-- 4-Point High-Tech Diamond Flare -->
      <path d="M 0 -22 L 4 -4 L 22 0 L 4 4 L 0 22 L -4 4 L -22 0 L -4 -4 Z" fill="#FFFFFF" filter="url(#intenseGlow)"/>
      <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z" fill="#E0F2FE"/>

      <!-- Diamond Core Pip -->
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Top Gloss Highlight on Stem Base -->
    <ellipse cx="256" cy="382" rx="6" ry="3" fill="#00F2FE" opacity="0.8" filter="url(#glowFilter)"/>

  </g>

  <!-- 1.5px Outer Precision Glassmorphism Border -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#glassBorder)" stroke-width="2.5"/>

  <!-- Inner Ambient Corner Highlights -->
  <path d="M 52 120 C 52 82, 82 52, 120 52" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
</svg>

