<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="100%" height="100%">
  <defs>
    <linearGradient id="waveBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#swGlow)">
    <!-- 9 rhythmic voice bars -->
    <rect x="8"  y="14" width="4" height="12" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="20" y="8"  width="4" height="24" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="32" y="16" width="4" height="8"  rx="2" fill="url(#waveBarGrad)"/>
    <rect x="44" y="4"  width="4" height="32" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="56" y="10" width="4" height="20" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="68" y="2"  width="4" height="36" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="80" y="12" width="4" height="16" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="92" y="6"  width="4" height="28" rx="2" fill="url(#waveBarGrad)"/>
    <rect x="104" y="15" width="4" height="10" rx="2" fill="url(#waveBarGrad)"/>
  </g>
</svg>

