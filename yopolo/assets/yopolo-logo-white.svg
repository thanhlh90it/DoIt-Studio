<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="100%" height="100%">
  <!-- Monochrome White Logo Variant -->
  <!-- ICON SECTION (x: 16, y: 16) -->
  <g transform="translate(16, 16)">
    <!-- Squircle Outline (108x108) -->
    <rect x="0" y="0" width="108" height="108" rx="26" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Left Wing -->
    <path d="M 29 33 C 38 44, 46 54, 54 62 C 51 58, 48 50, 42 41 C 38 34, 32 30, 29 33 Z" fill="#FFFFFF"/>

    <!-- Right Wing -->
    <path d="M 79 33 C 70 44, 62 54, 54 62 C 57 58, 60 50, 66 41 C 70 34, 76 30, 79 33 Z" fill="#FFFFFF"/>

    <!-- Center Stem -->
    <rect x="51.5" y="61" width="5" height="23" rx="2.5" fill="#FFFFFF"/>

    <!-- Soundwave ticks -->
    <path d="M 21 37 C 23 32, 27 28, 31 26" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 87 37 C 85 32, 81 28, 77 26" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Spark Diamond -->
    <g transform="translate(54, 61.5)">
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- WORDMARK SECTION -->
  <g transform="translate(148, 30)">
    <g id="wordmark-yopolo-white">
      <!-- 'Y' -->
      <path d="M 0 10 L 15 36 L 15 58 L 26 58 L 26 36 L 41 10 L 29 10 L 20.5 27 L 12 10 Z" fill="#FFFFFF"/>
      
      <!-- 'o' (first) -->
      <path d="M 68 18 C 53 18, 44 29, 44 38.5 C 44 48, 53 59, 68 59 C 83 59, 92 48, 92 38.5 C 92 29, 83 18, 68 18 Z M 68 28 C 76 28, 80 33, 80 38.5 C 80 44, 76 49, 68 49 C 60 49, 56 44, 56 38.5 C 56 33, 60 28, 68 28 Z" fill="#FFFFFF"/>

      <!-- 'p' -->
      <path d="M 98 19 L 109 19 L 109 25 C 113 20.5, 120 18, 128 18 C 141 18, 149 28, 149 38.5 C 149 49, 141 59, 128 59 C 120 59, 113 56.5, 109 52 L 109 72 L 98 72 Z M 123 28 C 115 28, 109 33, 109 38.5 C 109 44, 115 49, 123 49 C 131 49, 137 44, 137 38.5 C 137 33, 131 28, 123 28 Z" fill="#FFFFFF"/>

      <!-- 'o' (second) -->
      <g transform="translate(155, 18)">
        <path d="M 24 0 C 9 0, 0 11, 0 20.5 C 0 30, 9 41, 24 41 C 39 41, 48 30, 48 20.5 C 48 11, 39 0, 24 0 Z M 24 10 C 32 10, 36 15, 36 20.5 C 36 26, 32 31, 24 31 C 16 31, 12 26, 12 20.5 C 12 15, 16 10, 24 10 Z" fill="#FFFFFF"/>
        <circle cx="24" cy="20.5" r="3.5" fill="#FFFFFF"/>
        <circle cx="39" cy="8" r="2" fill="#FFFFFF"/>
      </g>

      <!-- 'l' -->
      <path d="M 213 8 L 224 8 L 224 58 L 213 58 Z" fill="#FFFFFF"/>

      <!-- 'o' (third) -->
      <path d="M 252 18 C 237 18, 228 29, 228 38.5 C 228 48, 237 59, 252 59 C 267 59, 276 48, 276 38.5 C 276 29, 267 18, 252 18 Z M 252 28 C 260 28, 264 33, 264 38.5 C 264 44, 260 49, 252 49 C 244 49, 240 44, 240 38.5 C 240 33, 244 28, 252 28 Z" fill="#FFFFFF"/>
    </g>

    <!-- Deep Tech AI Capsule Badge -->
    <g transform="translate(290, 22)">
      <rect x="0" y="0" width="46" height="24" rx="12" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="23" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">AI</text>
    </g>

    <!-- Tagline Subtitle -->
    <g transform="translate(2, 74)">
      <text x="0" y="8" fill="#FFFFFF" fill-opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.2" text-transform="uppercase">
        MULTI-LANGUAGE AI PARTNER
      </text>
    </g>
  </g>
</svg>

