<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="stkLeftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="stkRightWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="stkStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="stkTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="stkAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="stkBadgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="stkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="stkSparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON CENTERED (160x160 at x: 120, y: 30) -->
  <g transform="translate(120, 24)">
    <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#stkBg)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.8"/>
    
    <!-- Ambient Internal Nebula -->
    <circle cx="42" cy="36" r="48" fill="#00F2FE" opacity="0.3" filter="url(#stkGlow)"/>
    <circle cx="124" cy="56" r="48" fill="#D946EF" opacity="0.25" filter="url(#stkGlow)"/>
    <circle cx="80" cy="130" r="38" fill="#8B5CF6" opacity="0.3" filter="url(#stkGlow)"/>

    <!-- Left Wing -->
    <path d="M 42 48 C 56 68, 71 86, 80 92 C 74 80, 65 62, 53 45 C 49 39, 39 40, 42 48 Z" fill="url(#stkLeftWing)" filter="url(#stkGlow)"/>
    <path d="M 44 49 C 57 66, 68 80, 80 92 C 76 86, 71 74, 62 61 C 56 50, 47 44, 44 49 Z" fill="url(#stkLeftWing)"/>

    <!-- Right Wing -->
    <path d="M 118 48 C 104 68, 89 86, 80 92 C 86 80, 95 62, 107 45 C 111 39, 121 40, 118 48 Z" fill="url(#stkRightWing)" filter="url(#stkGlow)"/>
    <path d="M 116 49 C 103 66, 92 80, 80 92 C 84 86, 89 74, 98 61 C 104 50, 113 44, 116 49 Z" fill="url(#stkRightWing)"/>

    <!-- Center Stem -->
    <rect x="76" y="90" width="8" height="34" rx="4" fill="url(#stkStem)" filter="url(#stkGlow)"/>

    <!-- Soundwave ticks -->
    <path d="M 31 55 C 34 47, 40 41, 46 38" fill="none" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 129 55 C 126 47, 120 41, 114 38" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Spark Diamond -->
    <g transform="translate(80, 91)">
      <circle cx="0" cy="0" r="14" fill="#00F2FE" opacity="0.45" filter="url(#stkGlow)"/>
      <path d="M 0 -9 L 2.2 -2.2 L 9 0 L 2.2 2.2 L 0 9 L -2.2 2.2 L -9 0 L -2.2 -2.2 Z" fill="#FFFFFF" filter="url(#stkSparkle)"/>
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- Top Highlight -->
    <path d="M 18 18 Q 80 9 142 18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  </g>

  <!-- WORDMARK CENTERED -->
  <g transform="translate(36, 218)">
    <!-- Yopolo Wordmark centered in 328px box -->
    <!-- 'Y' -->
    <g transform="translate(18, 0)">
      <path d="M 0 10 L 15 36 L 15 58 L 26 58 L 26 36 L 41 10 L 29 10 L 20.5 27 L 12 10 Z" fill="url(#stkTextGrad)"/>
      
      <!-- 'o' (first) -->
      <path d="M 68 18 C 53 18, 44 29, 44 38.5 C 44 48, 53 59, 68 59 C 83 59, 92 48, 92 38.5 C 92 29, 83 18, 68 18 Z M 68 28 C 76 28, 80 33, 80 38.5 C 80 44, 76 49, 68 49 C 60 49, 56 44, 56 38.5 C 56 33, 60 28, 68 28 Z" fill="url(#stkTextGrad)"/>

      <!-- 'p' -->
      <path d="M 98 19 L 109 19 L 109 25 C 113 20.5, 120 18, 128 18 C 141 18, 149 28, 149 38.5 C 149 49, 141 59, 128 59 C 120 59, 113 56.5, 109 52 L 109 72 L 98 72 Z M 123 28 C 115 28, 109 33, 109 38.5 C 109 44, 115 49, 123 49 C 131 49, 137 44, 137 38.5 C 137 33, 131 28, 123 28 Z" fill="url(#stkTextGrad)"/>

      <!-- 'o' (second with Aurora Speech Focus) -->
      <g transform="translate(155, 18)">
        <circle cx="24" cy="20.5" r="18" fill="url(#stkAccent)" opacity="0.25" filter="url(#stkGlow)"/>
        <path d="M 24 0 C 9 0, 0 11, 0 20.5 C 0 30, 9 41, 24 41 C 39 41, 48 30, 48 20.5 C 48 11, 39 0, 24 0 Z M 24 10 C 32 10, 36 15, 36 20.5 C 36 26, 32 31, 24 31 C 16 31, 12 26, 12 20.5 C 12 15, 16 10, 24 10 Z" fill="url(#stkTextGrad)"/>
        <circle cx="24" cy="20.5" r="4" fill="url(#stkAccent)" filter="url(#stkGlow)"/>
        <circle cx="39" cy="8" r="2.2" fill="#00F2FE" filter="url(#stkSparkle)"/>
      </g>

      <!-- 'l' -->
      <path d="M 213 8 L 224 8 L 224 58 L 213 58 Z" fill="url(#stkTextGrad)"/>

      <!-- 'o' (third) -->
      <path d="M 252 18 C 237 18, 228 29, 228 38.5 C 228 48, 237 59, 252 59 C 267 59, 276 48, 276 38.5 C 276 29, 267 18, 252 18 Z M 252 28 C 260 28, 264 33, 264 38.5 C 264 44, 260 49, 252 49 C 244 49, 240 44, 240 38.5 C 240 33, 244 28, 252 28 Z" fill="url(#stkTextGrad)"/>
    </g>
  </g>

  <!-- SUBTITLE & BADGE -->
  <g transform="translate(200, 320)" text-anchor="middle">
    <!-- Capsule Container -->
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0B132B" fill-opacity="0.8" stroke="url(#stkBadgeBorder)" stroke-width="1.2"/>
    <text x="0" y="4.5" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.5">
      AI LANGUAGE PARTNER
    </text>
  </g>

  <!-- MOTTO / SLOGAN LINE -->
  <g transform="translate(200, 375)" text-anchor="middle">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12.5" font-weight="500" letter-spacing="1">
      Speak Freely. Explore Fearlessly.
    </text>
  </g>
</svg>

