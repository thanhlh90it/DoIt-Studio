<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Rich Family Blue Multi-Stop Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Top Soft Ambient Sheen -->
    <radialGradient id="topSheen" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Smile Golden Glow -->
    <linearGradient id="smileGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Icon Drop Shadow for 3D Depth -->
    <filter id="iconDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0B132B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#appBgGrad)" />
  <rect width="1024" height="1024" rx="230" fill="url(#topSheen)" />

  <!-- Center Bold & Prominent White Shelter & Smile Symbol -->
  <g transform="translate(100, 105) scale(1.7)" filter="url(#iconDepth)">
    <!-- Cột trái trắng sáng -->
    <rect x="106" y="180" width="56" height="236" rx="28" fill="#FFFFFF" />

    <!-- Mái nhà & Nét chữ N trắng tinh khôi -->
    <path d="M 134 200 
             C 134 140, 206 96, 256 96 
             C 306 96, 378 140, 378 200 
             L 378 388 
             C 378 403, 366 416, 350 416 
             C 334 416, 322 403, 322 388 
             L 322 220 
             C 322 176, 280 152, 256 152 
             C 232 152, 190 176, 190 220 
             L 190 388 
             C 190 403, 178 416, 162 416 
             C 146 416, 134 403, 134 388 
             Z" 
          fill="#FFFFFF" />

    <!-- Nụ cười sum vầy vàng rạng rỡ -->
    <path d="M 188 280 
             C 214 340, 298 340, 324 280 
             C 332 262, 310 250, 298 266 
             C 280 292, 232 292, 214 266 
             C 202 250, 180 262, 188 280 Z" 
          fill="url(#smileGold)" />

    <!-- Ngôi sao vàng trên đỉnh mái -->
    <circle cx="256" cy="62" r="16" fill="#FDE047" />
  </g>
</svg>
