<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Modern Zen Sunset Orange Multi-Stop Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Soft Glassmorphism Ambient Light / Sheen -->
    <radialGradient id="topSheen" cx="40%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Golden Amber Glow for Smile & Star -->
    <linearGradient id="smileGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Frosted Glass Rim Light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Warm 3D Ambient Depth Shadow -->
    <filter id="iconDepth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#431407" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#431407" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Full-bleed background (Apple App Store & Android Square launcher) -->
  <rect width="1024" height="1024" fill="url(#appBgGrad)" />
  <rect width="1024" height="1024" fill="url(#topSheen)" />

  <!-- Center Symbol: Shelter (Mái Ấm) & Smile (Nụ Cười) & Star -->
  <g transform="translate(100, 105) scale(1.7)" filter="url(#iconDepth)">
    <!-- Cột trái trắng sáng -->
    <rect x="106" y="180" width="56" height="236" rx="28" fill="#FFFFFF" />

    <!-- Mái nhà & Nét chữ N trắng ngọc tinh khôi -->
    <path d="M 134 200 
             C 134 140, 206 96, 256 96 
             C 306 96, 378 140, 378 200 
             L 378 388 
             C 378 403, 366 416, 350 416 
             C 334 416, 322 403, 322 388 
             L 322 220 
             C 322 176, 280 152, 256 152 
             C 232 152, 190 176, 190 220 
             L 190 388 
             C 190 403, 178 416, 162 416 
             C 146 416, 134 403, 134 388 
             Z" 
          fill="#FFFFFF" />

    <!-- Nụ cười sum vầy vàng ấm áp -->
    <path d="M 188 280 
             C 214 340, 298 340, 324 280 
             C 332 262, 310 250, 298 266 
             C 280 292, 232 292, 214 266 
             C 202 250, 180 262, 188 280 Z" 
          fill="url(#smileGold)" />

    <!-- Ngôi sao vàng trên đỉnh mái -->
    <circle cx="256" cy="62" r="16" fill="url(#smileGold)" />
  </g>
</svg>
