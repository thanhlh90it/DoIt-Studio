<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sunset Orange 500 Gradient for Standalone Vector Mark -->
    <linearGradient id="markOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Warm Golden Amber Glow for Smile & Star -->
    <linearGradient id="markSmileGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Soft Ambient Warm Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#431407" flood-opacity="0.18" />
    </filter>
  </defs>

  <g transform="translate(50, 45) scale(1.08)" filter="url(#markShadow)">
    <!-- Cột trái chữ N -->
    <rect x="106" y="180" width="56" height="236" rx="28" fill="url(#markOrangeGrad)" />

    <!-- Mái nhà che chở & nét lượn chữ N -->
    <path d="M 134 200 
             C 134 140, 206 96, 256 96 
             C 306 96, 378 140, 378 200 
             L 378 388 
             C 378 403, 366 416, 350 416 
             C 334 416, 322 403, 322 388 
             L 322 220 
             C 322 176, 280 152, 256 152 
             C 232 152, 190 176, 190 220 
             L 190 388 
             C 190 403, 178 416, 162 416 
             C 146 416, 134 403, 134 388 
             Z" 
          fill="url(#markOrangeGrad)" />

    <!-- Nụ cười sum vầy vàng ấm áp -->
    <path d="M 188 280 
             C 214 340, 298 340, 324 280 
             C 332 262, 310 250, 298 266 
             C 280 292, 232 292, 214 266 
             C 202 250, 180 262, 188 280 Z" 
          fill="url(#markSmileGold)" />

    <!-- Ngôi sao vàng trên đỉnh mái -->
    <circle cx="256" cy="62" r="16" fill="url(#markSmileGold)" />
  </g>
</svg>
