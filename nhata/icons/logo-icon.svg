<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nhaTaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="warmSunGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D4ED8" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Shelter & Smile Mark (Biểu tượng Chữ N Mái Ấm & Nụ Cười NhàTa - Prominent & Bold) -->
  <g transform="translate(-34, -26) scale(1.2)" filter="url(#softGlow)">
    <!-- Cột trái vững chãi -->
    <rect x="106" y="180" width="56" height="236" rx="28" fill="url(#nhaTaBlueGrad)" />

    <!-- Mái nhà & Nét vươn chữ N -->
    <path d="M 134 200 
             C 134 140, 206 96, 256 96 
             C 306 96, 378 140, 378 200 
             L 378 388 
             C 378 403, 366 416, 350 416 
             C 334 416, 322 403, 322 388 
             L 322 220 
             C 322 176, 280 152, 256 152 
             C 232 152, 190 176, 190 220 
             L 190 388 
             C 190 403, 178 416, 162 416 
             C 146 416, 134 403, 134 388 
             Z" 
          fill="url(#nhaTaBlueGrad)" />

    <!-- Nét cười sum vầy ấm áp -->
    <path d="M 188 280 
             C 214 340, 298 340, 324 280 
             C 332 262, 310 250, 298 266 
             C 280 292, 232 292, 214 266 
             C 202 250, 180 262, 188 280 Z" 
          fill="url(#warmSunGlow)" />

    <!-- Ngôi sao hạnh phúc nhỏ -->
    <circle cx="256" cy="62" r="14" fill="#F59E0B" />
  </g>
</svg>
