<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="100%" height="100%">
  <defs>
    <!-- Background Glass Gradient -->
    <linearGradient id="hGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Aurora Gradients for Horizontal Wordmark -->
    <linearGradient id="hLeftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="hRightWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="hStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="auroraTextAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON SECTION (x: 15 to 125, y: 15 to 125) -->
  <g transform="translate(16, 16)">
    <!-- Squircle Glass Base (108x108) -->
    <rect x="0" y="0" width="108" height="108" rx="26" fill="url(#hGlassBg)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2"/>
    
    <!-- Ambient Internal Nebula -->
    <circle cx="28" cy="24" r="32" fill="#00F2FE" opacity="0.25" filter="url(#hGlow)"/>
    <circle cx="84" cy="38" r="32" fill="#D946EF" opacity="0.22" filter="url(#hGlow)"/>
    <circle cx="54" cy="88" r="26" fill="#8B5CF6" opacity="0.25" filter="url(#hGlow)"/>

    <!-- Left Wing -->
    <path d="M 28 32 C 38 46, 48 58, 54 62 C 50 54, 44 42, 36 30 C 33 26, 26 27, 28 32 Z" fill="url(#hLeftWing)" filter="url(#hGlow)"/>
    <path d="M 29 33 C 38 44, 46 54, 54 62 C 51 58, 48 50, 42 41 C 38 34, 32 30, 29 33 Z" fill="url(#hLeftWing)"/>

    <!-- Right Wing -->
    <path d="M 80 32 C 70 46, 60 58, 54 62 C 58 54, 64 42, 72 30 C 75 26, 82 27, 80 32 Z" fill="url(#hRightWing)" filter="url(#hGlow)"/>
    <path d="M 79 33 C 70 44, 62 54, 54 62 C 57 58, 60 50, 66 41 C 70 34, 76 30, 79 33 Z" fill="url(#hRightWing)"/>

    <!-- Center Stem -->
    <rect x="51.5" y="61" width="5" height="23" rx="2.5" fill="url(#hStem)" filter="url(#hGlow)"/>

    <!-- Soundwave ticks -->
    <path d="M 21 37 C 23 32, 27 28, 31 26" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 87 37 C 85 32, 81 28, 77 26" fill="none" stroke="#EC4899" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Spark Diamond -->
    <g transform="translate(54, 61.5)">
      <circle cx="0" cy="0" r="10" fill="#00F2FE" opacity="0.4" filter="url(#hGlow)"/>
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#FFFFFF" filter="url(#sparkle)"/>
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
    </g>

    <!-- Top Highlight -->
    <path d="M 12 12 Q 54 6 96 12" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
  </g>

  <!-- WORDMARK & TYPOGRAPHY SECTION -->
  <g transform="translate(148, 30)">
    
    <!-- Brand Name: "Yopolo" in Precision Deep Tech Style -->
    <g id="wordmark-yopolo">
      <!-- 'Y' -->
      <path d="M 0 10 L 15 36 L 15 58 L 26 58 L 26 36 L 41 10 L 29 10 L 20.5 27 L 12 10 Z" fill="url(#textGrad)"/>
      
      <!-- 'o' (first) -->
      <path d="M 68 18 C 53 18, 44 29, 44 38.5 C 44 48, 53 59, 68 59 C 83 59, 92 48, 92 38.5 C 92 29, 83 18, 68 18 Z M 68 28 C 76 28, 80 33, 80 38.5 C 80 44, 76 49, 68 49 C 60 49, 56 44, 56 38.5 C 56 33, 60 28, 68 28 Z" fill="url(#textGrad)"/>

      <!-- 'p' -->
      <path d="M 98 19 L 109 19 L 109 25 C 113 20.5, 120 18, 128 18 C 141 18, 149 28, 149 38.5 C 149 49, 141 59, 128 59 C 120 59, 113 56.5, 109 52 L 109 72 L 98 72 Z M 123 28 C 115 28, 109 33, 109 38.5 C 109 44, 115 49, 123 49 C 131 49, 137 44, 137 38.5 C 137 33, 131 28, 123 28 Z" fill="url(#textGrad)"/>

      <!-- 'o' (second - The Aurora Speech Focus Node) -->
      <g transform="translate(155, 18)">
        <!-- Subtle back glow -->
        <circle cx="24" cy="20.5" r="18" fill="url(#auroraTextAccent)" opacity="0.25" filter="url(#hGlow)"/>
        <!-- Ring -->
        <path d="M 24 0 C 9 0, 0 11, 0 20.5 C 0 30, 9 41, 24 41 C 39 41, 48 30, 48 20.5 C 48 11, 39 0, 24 0 Z M 24 10 C 32 10, 36 15, 36 20.5 C 36 26, 32 31, 24 31 C 16 31, 12 26, 12 20.5 C 12 15, 16 10, 24 10 Z" fill="url(#textGrad)"/>
        <!-- Voice Orb In Center -->
        <circle cx="24" cy="20.5" r="4" fill="url(#auroraTextAccent)" filter="url(#hGlow)"/>
        <!-- Satellite dot orbiting -->
        <circle cx="39" cy="8" r="2.2" fill="#00F2FE" filter="url(#sparkle)"/>
      </g>

      <!-- 'l' -->
      <path d="M 213 8 L 224 8 L 224 58 L 213 58 Z" fill="url(#textGrad)"/>

      <!-- 'o' (third) -->
      <path d="M 252 18 C 237 18, 228 29, 228 38.5 C 228 48, 237 59, 252 59 C 267 59, 276 48, 276 38.5 C 276 29, 267 18, 252 18 Z M 252 28 C 260 28, 264 33, 264 38.5 C 264 44, 260 49, 252 49 C 244 49, 240 44, 240 38.5 C 240 33, 244 28, 252 28 Z" fill="url(#textGrad)"/>
    </g>

    <!-- Deep Tech AI Capsule Badge -->
    <g transform="translate(290, 22)">
      <!-- Glass Pill Container -->
      <rect x="0" y="0" width="46" height="24" rx="12" fill="#0B132B" fill-opacity="0.8" stroke="url(#badgeBorder)" stroke-width="1.2"/>
      <text x="23" y="16" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">AI</text>
      <!-- Tiny pulsing dot -->
      <circle cx="39" cy="7" r="1.5" fill="#00F2FE" filter="url(#sparkle)"/>
    </g>

    <!-- Tagline Subtitle: High-Precision Monospace / Geometric Sub-header -->
    <g transform="translate(2, 74)">
      <text x="0" y="8" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.2" text-transform="uppercase">
        MULTI-LANGUAGE AI PARTNER
      </text>
      <!-- Tech status indicator line -->
      <circle cx="260" cy="4.5" r="2.5" fill="#10B981" filter="url(#hGlow)"/>
      <text x="270" y="8" fill="#64748B" font-family="monospace" font-size="9.5" letter-spacing="1.5">v1.0</text>
    </g>
  </g>
</svg>

