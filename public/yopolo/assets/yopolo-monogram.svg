<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="monoLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="monoRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="monoStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="monoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Underglow -->
  <circle cx="64" cy="64" r="44" fill="#00F2FE" opacity="0.12" filter="url(#monoGlow)"/>

  <!-- Left Wing -->
  <path d="M 32 30 C 44 48, 56 64, 64 70 C 58 60, 50 44, 38 28 C 34 23, 27 24, 32 30 Z" fill="url(#monoLeft)" filter="url(#monoGlow)"/>
  <path d="M 33 32 C 45 47, 54 60, 64 70 C 60 64, 56 53, 47 41 C 41 32, 34 28, 33 32 Z" fill="url(#monoLeft)"/>

  <!-- Right Wing -->
  <path d="M 96 30 C 84 48, 72 64, 64 70 C 70 60, 78 44, 90 28 C 94 23, 101 24, 96 30 Z" fill="url(#monoRight)" filter="url(#monoGlow)"/>
  <path d="M 95 32 C 83 47, 74 60, 64 70 C 68 64, 72 53, 81 41 C 87 32, 94 28, 95 32 Z" fill="url(#monoRight)"/>

  <!-- Center Stem -->
  <rect x="60.5" y="68" width="7" height="32" rx="3.5" fill="url(#monoStem)" filter="url(#monoGlow)"/>

  <!-- Speech Wave Ticks -->
  <path d="M 23 37 C 26 31, 31 25, 37 22" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 105 37 C 102 31, 97 25, 91 22" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Star Spark -->
  <g transform="translate(64, 69)">
    <circle cx="0" cy="0" r="12" fill="#00F2FE" opacity="0.4"/>
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>

