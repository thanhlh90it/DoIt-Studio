<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bearBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bearBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura / Background Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#alertGlow)"/>

  <!-- Left Ear -->
  <circle cx="62" cy="58" r="22" fill="url(#bearBody)" filter="url(#softShadow)"/>
  <circle cx="62" cy="58" r="12" fill="#FDE68A"/>

  <!-- Right Ear -->
  <circle cx="138" cy="58" r="22" fill="url(#bearBody)" filter="url(#softShadow)"/>
  <circle cx="138" cy="58" r="12" fill="#FDE68A"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="52" ry="46" fill="url(#bearBody)" filter="url(#softShadow)"/>

  <!-- Cheeks -->
  <circle cx="70" cy="105" r="9" fill="#F87171" opacity="0.6"/>
  <circle cx="130" cy="105" r="9" fill="#F87171" opacity="0.6"/>

  <!-- Snout Area -->
  <ellipse cx="100" cy="105" rx="24" ry="18" fill="url(#bearBelly)"/>
  <!-- Nose -->
  <ellipse cx="100" cy="98" rx="8" ry="6" fill="#78350F"/>
  <!-- Mouth Smile -->
  <path d="M92 108 Q100 118 108 108" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkling Eyes -->
  <circle cx="78" cy="85" r="7" fill="#1F2937"/>
  <circle cx="76" cy="83" r="2.5" fill="#FFFFFF"/>
  <circle cx="80" cy="87" r="1.2" fill="#FFFFFF"/>

  <circle cx="122" cy="85" r="7" fill="#1F2937"/>
  <circle cx="120" cy="83" r="2.5" fill="#FFFFFF"/>
  <circle cx="124" cy="87" r="1.2" fill="#FFFFFF"/>

  <!-- Raised Waving Paw (Left Hand) -->
  <g transform="rotate(-20 40 100)">
    <ellipse cx="42" cy="90" rx="14" ry="18" fill="url(#bearBody)" filter="url(#softShadow)"/>
    <circle cx="42" cy="90" r="7" fill="#FDE68A"/>
  </g>

  <!-- Right Paw -->
  <g transform="rotate(20 160 100)">
    <ellipse cx="158" cy="90" rx="14" ry="18" fill="url(#bearBody)" filter="url(#softShadow)"/>
    <circle cx="158" cy="90" r="7" fill="#FDE68A"/>
  </g>

  <!-- Sparkles / Eye-Rest stars -->
  <path d="M40 45 Q48 45 48 37 Q48 45 56 45 Q48 45 48 53 Q48 45 40 45" fill="#F59E0B"/>
  <path d="M150 40 Q156 40 156 34 Q156 40 162 40 Q156 40 156 46 Q156 40 150 40" fill="#F59E0B"/>
  <path d="M100 30 Q104 30 104 26 Q104 30 108 30 Q104 30 104 34 Q104 30 100 30" fill="#F59E0B"/>
</svg>
