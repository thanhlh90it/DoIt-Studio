<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- TV Body Gradient -->
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Screen Inner Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Orange Accent Glow -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Protective Shield Subtle Halo -->
  <path d="M 256 60 Q 370 75 390 190 Q 390 320 256 420 Q 122 320 122 190 Q 142 75 256 60 Z"
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="10 10"/>

  <!-- Main Mascot & TV Group -->
  <g filter="url(#dropShadow)">
    <!-- Playful Antennas -->
    <path d="M 210 160 L 165 110" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="160" cy="105" r="14" fill="url(#orangeGrad)"/>

    <path d="M 302 160 L 347 110" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="352" cy="105" r="14" fill="url(#orangeGrad)"/>

    <!-- TV Body (Squircle) -->
    <rect x="116" y="150" width="280" height="220" rx="46" fill="url(#tvGrad)"/>

    <!-- TV Stand Legs -->
    <path d="M 180 370 L 165 405 M 332 370 L 347 405" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round"/>

    <!-- TV Inner Screen -->
    <rect x="140" y="174" width="232" height="172" rx="30" fill="url(#screenGrad)"/>

    <!-- Eyes (Friendly, Curved Sparkle) -->
    <circle cx="200" cy="245" r="18" fill="#60A5FA"/>
    <circle cx="204" cy="241" r="7" fill="#FFFFFF"/>

    <circle cx="312" cy="245" r="18" fill="#60A5FA"/>
    <circle cx="316" cy="241" r="7" fill="#FFFFFF"/>

    <!-- Cute Blush -->
    <circle cx="178" cy="265" r="10" fill="#F43F5E" opacity="0.4"/>
    <circle cx="334" cy="265" r="10" fill="#F43F5E" opacity="0.4"/>

    <!-- Smiling Mouth -->
    <path d="M 232 268 Q 256 292 280 268" fill="none" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
