<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Neumorphic Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFBF7"/>
      <stop offset="50%" stop-color="#D7F4EE"/>
      <stop offset="100%" stop-color="#C2EFE6"/>
    </linearGradient>

    <!-- Bevel & Edge Light -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A5E7DC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Butterfly Teal Glass Gradient -->
    <linearGradient id="butterflyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#E6FFFA" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Wing Fill Soft Glow -->
    <linearGradient id="wingFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Center Warm Coral Glow -->
    <radialGradient id="coralCoreGlow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#FF7849" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FB923C" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#FDBA74" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F4FAF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Neumorphic Drop Shadow -->
    <filter id="neuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="-10" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="12" dy="14" stdDeviation="18" flood-color="#0D9488" flood-opacity="0.16"/>
    </filter>

    <!-- Butterfly Glow Filter -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Soft Drop Shadows -->
  <rect x="36" y="36" width="440" height="440" rx="105" fill="url(#bgGradient)" filter="url(#neuShadow)"/>
  
  <!-- Outer Bevel Stroke -->
  <rect x="37" y="37" width="438" height="438" rx="104" fill="none" stroke="url(#edgeHighlight)" stroke-width="4"/>

  <!-- Inner Soft Bevel Ring -->
  <rect x="56" y="56" width="400" height="400" rx="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Center Ambient Core Coral Glow -->
  <circle cx="256" cy="265" r="95" fill="url(#coralCoreGlow)"/>

  <!-- Thyroid Butterfly / Zen Infinity Symbol -->
  <g transform="translate(0, 5)" filter="url(#glowEffect)">
    
    <!-- Left Wing (Top & Bottom Leaf Curve) -->
    <!-- Top-Left Wing -->
    <path d="M 256,252 C 242,205 198,145 132,156 C 88,164 78,218 108,268 C 132,308 200,312 250,265 Z" 
          fill="url(#wingFill)" 
          stroke="url(#butterflyGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Left Inner Vein / Zen Loop -->
    <path d="M 125,185 C 165,215 205,250 248,258" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-opacity="0.75"/>

    <!-- Bottom-Left Wing -->
    <path d="M 248,272 C 220,310 162,375 118,348 C 88,328 105,282 142,272" 
          fill="url(#wingFill)" 
          stroke="url(#butterflyGradient)" 
          stroke-width="11" 
          stroke-linecap="round"/>

    <!-- Right Wing (Top & Bottom Leaf Curve) - Mirrored -->
    <!-- Top-Right Wing -->
    <path d="M 256,252 C 270,205 314,145 380,156 C 424,164 434,218 404,268 C 380,308 312,312 262,265 Z" 
          fill="url(#wingFill)" 
          stroke="url(#butterflyGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Inner Vein / Zen Loop -->
    <path d="M 387,185 C 347,215 307,250 264,258" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-opacity="0.75"/>

    <!-- Bottom-Right Wing -->
    <path d="M 264,272 C 292,310 350,375 394,348 C 424,328 407,282 370,272" 
          fill="url(#wingFill)" 
          stroke="url(#butterflyGradient)" 
          stroke-width="11" 
          stroke-linecap="round"/>

    <!-- Center Isthmus / Thyroid Node & Antennae Curve -->
    <!-- Soft Antennae (Zen Balance Curves) -->
    <path d="M 242,192 C 235,165 218,142 202,138" 
          fill="none" 
          stroke="#0D9488" 
          stroke-width="8" 
          stroke-linecap="round"/>
    <path d="M 270,192 C 277,165 294,142 310,138" 
          fill="none" 
          stroke="#0D9488" 
          stroke-width="8" 
          stroke-linecap="round"/>

    <!-- Center Warm Pulse Node -->
    <circle cx="256" cy="260" r="16" fill="#F97316" filter="url(#glowEffect)"/>
    <circle cx="256" cy="260" r="8" fill="#FFFFFF"/>
  </g>
</svg>
