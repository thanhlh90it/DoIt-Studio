<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Pledgo App Icon (iOS / Android 512x512) -->
  <defs>
    <!-- Background Gradient (Deep Obsidian to Midnight Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" />
      <stop offset="50%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Metallic Brushed Bronze Gradient -->
    <linearGradient id="iconBronze" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Titanium Frost Metallic Gradient -->
    <linearGradient id="iconTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D97706" flood-opacity="0.25" />
    </filter>

    <!-- Hairline Rim Light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="510" height="510" rx="114" stroke="url(#rimLight)" stroke-width="2" fill="none" />

  <!-- Subtle Concentric Time Ring Watermark in Background -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255, 255, 255, 0.03)" stroke-width="2" />
  <circle cx="256" cy="256" r="150" stroke="rgba(217, 119, 6, 0.05)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Scaled Icon Mark (Centered) -->
  <g transform="translate(116, 106) scale(2.8)" filter="url(#iconShadow)">
    <!-- Trục đứng Monolith -->
    <rect x="20" y="16" width="10" height="68" rx="4" fill="url(#iconTitanium)" />

    <!-- Vòng khuyên Chrono Loop -->
    <path d="M 30 20 H 54 C 68 20, 78 28, 78 40 C 78 49, 70 56, 60 58 C 52 60, 44 58, 38 64 C 34 68, 32 74, 30 80 L 30 68 C 36 63, 42 61, 48 60 C 62 58, 68 50, 68 40 C 68 32, 60 28, 52 28 H 30 Z" fill="url(#iconBronze)" />

    <!-- Sóng thoát Go Vector -->
    <path d="M 44 65 Q 58 64, 68 76 L 78 76 Q 64 60, 48 59 Z" fill="url(#iconTitanium)" opacity="0.9" />

    <!-- Điểm hội tụ Ngày Hiện Tại -->
    <circle cx="50" cy="39" r="3.5" fill="#FFFFFF" />
    <circle cx="50" cy="39" r="6" stroke="#FCD34D" stroke-width="1.5" fill="none" opacity="0.8" />
  </g>
</svg>
