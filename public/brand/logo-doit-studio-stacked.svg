<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="st-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="st-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="st-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="st-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="300" height="300" rx="36" fill="url(#st-bg)" stroke="#1E293B" stroke-width="2" />
  <rect x="12" y="12" width="296" height="296" rx="34" fill="none" stroke="url(#st-blue)" stroke-width="1.5" opacity="0.4" />

  <!-- Center Monogram -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="120" height="120" rx="30" fill="#030712" stroke="#1E293B" stroke-width="2" />
    <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#st-blue)" stroke-width="1.5" opacity="0.6" />
    
    <!-- Monogram D -->
    <path d="M 34 32 C 34 26, 38 24, 44 24 L 62 24 C 80 24, 94 36, 94 58 C 94 80, 80 92, 62 92 L 44 92 C 38 92, 34 90, 34 84 Z M 48 40 L 48 76 L 60 76 C 70 76, 78 68, 78 58 C 78 48, 70 40, 60 40 Z" fill="url(#st-blue)" />
    
    <!-- Cyber Cyan Dot -->
    <circle cx="94" cy="84" r="10" fill="url(#st-cyan)" filter="url(#st-glow)" />
    <circle cx="94" cy="84" r="5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(160, 215)">
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
      DoIT<tspan fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700"> [STUDIO]</tspan>
    </text>
    <text x="0" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.16em">
      PRODUCT • COACHING • DX
    </text>
  </g>
</svg>
