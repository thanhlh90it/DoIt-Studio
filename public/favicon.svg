<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Obsidian Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Ultramarine Primary Gradient -->
    <linearGradient id="ultramarine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1852F6" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>

    <!-- Bright Accent Glow Gradient -->
    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0038A8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Inner Subtle Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="url(#ultramarine-grad)" stroke-width="3" opacity="0.4" />

  <!-- Core Emblem: DoIT Monogram -->
  <g transform="translate(10, 0)">
    <!-- Letter 'D' -->
    <path d="M 130 140 C 130 128, 140 118, 154 118 L 220 118 C 285 118, 330 162, 330 256 C 330 350, 285 394, 220 394 L 154 394 C 140 394, 130 384, 130 372 Z M 186 174 L 186 338 L 218 338 C 255 338, 274 308, 274 256 C 274 204, 255 174, 218 174 Z" fill="url(#ultramarine-grad)" />

    <!-- Slash / Spark Action Dot -->
    <circle cx="360" cy="336" r="32" fill="url(#cyan-glow-grad)" filter="url(#soft-glow)" />
    <circle cx="360" cy="336" r="18" fill="#FFFFFF" />
  </g>
</svg>
