<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 2778" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="splashBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8FF" />
      <stop offset="60%" stop-color="#F3F3FC" />
      <stop offset="100%" stop-color="#E7E7F1" />
    </linearGradient>

    <!-- Sapphire Gradient -->
    <linearGradient id="spSapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B66" />
      <stop offset="50%" stop-color="#003C90" />
      <stop offset="100%" stop-color="#1D59C1" />
    </linearGradient>

    <!-- Teal Mint Gradient -->
    <linearGradient id="spTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006A65" />
      <stop offset="50%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <filter id="spGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1284" height="2778" fill="url(#splashBgGrad)" />

  <!-- Subtle Radial Glow in Center -->
  <circle cx="642" cy="1200" r="450" fill="#00A896" opacity="0.06" filter="url(#spGlow)" />

  <!-- Center Group: Logo Mark + Wordmark -->
  <g transform="translate(642, 1150) scale(3.2) translate(-100, -100)">
    <!-- Ultrasonic Wave Arcs -->
    <path d="M 52 152 C 40 125 40 75 62 48 C 66 43 73 45 74 51 C 75 58 70 63 68 67 C 54 88 54 120 64 142 C 67 148 62 155 55 155 C 53 155 52 154 52 152 Z" 
          fill="url(#spSapphireGrad)" />

    <path d="M 66 52 C 72 46 82 50 86 58 L 126 132 C 128 136 133 138 137 136 C 141 134 143 129 141 125 L 102 52 C 98 44 104 36 113 36 C 117 36 122 39 124 43 L 158 116 C 160 120 160 124 158 128 C 153 140 141 148 128 148 C 119 148 111 143 106 135 L 68 64 C 66 60 62 58 58 60 C 53 62 52 68 55 72 L 82 124 C 85 130 80 137 73 137 C 68 137 64 133 62 129 L 46 95 C 44 91 46 86 50 84 C 54 82 59 84 61 88 L 66 98 Z" 
          fill="url(#spSapphireGrad)" />

    <path d="M 148 48 C 160 75 160 125 138 152 C 134 157 127 155 126 149 C 125 142 130 137 132 133 C 146 112 146 80 136 58 C 133 52 138 45 145 45 C 147 45 148 46 148 48 Z" 
          fill="url(#spTealGrad)" />

    <!-- Radar Rings -->
    <circle cx="100" cy="100" r="62" stroke="url(#spSapphireGrad)" stroke-width="2.5" stroke-dasharray="4 8" opacity="0.25" fill="none" />
    <circle cx="100" cy="100" r="42" stroke="url(#spTealGrad)" stroke-width="2" stroke-dasharray="3 6" opacity="0.4" fill="none" />

    <!-- Reticle Ticks -->
    <line x1="100" y1="46" x2="100" y2="54" stroke="#00A896" stroke-width="2.5" stroke-linecap="round" />
    <line x1="100" y1="146" x2="100" y2="154" stroke="#00A896" stroke-width="2.5" stroke-linecap="round" />
    <line x1="46" y1="100" x2="54" y2="100" stroke="#003C90" stroke-width="2.5" stroke-linecap="round" />
    <line x1="146" y1="100" x2="154" y2="100" stroke="#003C90" stroke-width="2.5" stroke-linecap="round" />

    <!-- Central Glowing Node -->
    <circle cx="100" cy="100" r="16" fill="url(#spTealGrad)" filter="url(#spGlow)" />
    <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Typography: App Name -->
  <text x="642" y="1590" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#003C90">Nodule</tspan><tspan fill="#00A896">Track</tspan>
  </text>

  <!-- Tagline -->
  <text x="642" y="1660" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#434653" letter-spacing="0.14em">
    CLINICAL CLARITY FOR EVERY SCAN
  </text>

  <!-- Bottom Brand Slogan -->
  <text x="642" y="2580" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#737784" letter-spacing="0.06em">
    Minh bạch diễn biến • An tâm điều trị
  </text>
</svg>
